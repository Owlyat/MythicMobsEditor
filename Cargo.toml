[package]
name = "MythicMobsEditor"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "web_screen_reader",
    "x11",
] }
egui = "0.37.0"
rfd = "0.18.0"
rust-i18n = "4.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9"
strum = { version = "0.28.0", features = ["derive"] }
